apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: npm
spec:
  workspaces:
    - name: source
  steps:
    - name: npm-install
      image: node:16
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/bash
        npm install
---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: jasmine
spec:
  workspaces:
    - name: source
  steps:
    - name: run-tests
      image: node:16
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/bash
        npx jasmine
