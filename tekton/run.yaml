apiVersion: tekton.dev/v1beta1
kind: PipelineRun
metadata:
  name: tax-calculator-pipeline-run
spec:
  pipelineRef:
    name: tax-calculator-pipeline
  params:
    - name: repo-url
      value: "https://github.com/jaralusman888-arch/juphc-tc_pipeline"
    - name: image-name
      value: "us.icr.io/$SN_CR_NAMESPACE/tax-calculator:1.0"
  workspaces:
    - name: source
      persistentVolumeClaim:
        claimName: pipelinerun-pvc
